name = "mecanica-sonderegger-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# =====================================================
# Base de datos D1
# 1) npm run db:create   ->  te muestra el database_id
# 2) Copia ese id aquí abajo
# =====================================================
[[d1_databases]]
binding = "DB"
database_name = "mecanica-sonderegger-db"
database_id = "REEMPLAZAR_CON_EL_ID_DE_TU_D1"

# =====================================================
# Si el frontend vive en un origen distinto al worker
# (p.ej. frontend en pages.dev y API en workers.dev),
# define el origen permitido para CORS:
# [vars]
# CORS_ORIGIN = "https://taller.su-dominio.com"
#
# La configuración recomendada es servir /api en el MISMO
# dominio (Proxy de Pages), de modo que no hace falta CORS.
# =====================================================